spring:
  application:
    name: ConsulGateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4300"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
            allowedHeaders:
              - "*"
    consul:
      config:
        import-check:
          enabled: false
        enabled: true
      host: localhost
      port: 8500
      discovery:
        enabled: true
        service-name: ${spring.application.name}

server:
  port: 8888


logging:
  level:
    org:
      springframework:
        cloud:
          gateway: DEBUG
        web: DEBUG
management:
  endpoints:
    web:
      exposure:
        include: '*'
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}