server:
  port: 8088

spring:
    application:
        name: ClientService
    cloud:
        consul:
        config:
            import-check:
            enabled: false
        host: localhost
        port: 8500
        discovery:
            enabled: true
            service-name: ${spring.application.name}

logging:
  level:
    org:
      springframework:
        cloud: DEBUG
        web: DEBUG
management:
  endpoints:
    web:
      exposure:
        include: '*'
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}